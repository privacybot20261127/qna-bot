<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>법령 QnA 챗봇</title>
<style>
  :root {
    --bg: #f4f6f9;
    --panel: #ffffff;
    --ink: #1c2430;
    --ink-soft: #5b6676;
    --line: #e1e6ee;
    --brand: #1f5fbf;
    --brand-soft: #e8f0fc;
    --user: #1f5fbf;
    --warn-bg: #fff7e0;
    --warn-ink: #7a5a00;
    --ok: #1e9e5a;
    --err: #c8372d;
    --radius: 14px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Pretendard", "Malgun Gothic", "Apple SD Gothic Neo", system-ui, sans-serif;
    font-size: 15px;
    line-height: 1.6;
    display: flex;
    flex-direction: column;
  }

  header {
    background: var(--panel);
    border-bottom: 1px solid var(--line);
    padding: 14px 20px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .logo {
    width: 36px; height: 36px; border-radius: 10px;
    background: var(--brand); color: #fff;
    display: grid; place-items: center; font-weight: 700; font-size: 14px;
    flex-shrink: 0;
  }
  header h1 { font-size: 17px; margin: 0; }
  header p { margin: 0; font-size: 12.5px; color: var(--ink-soft); }
  .head-right { margin-left: auto; display: flex; align-items: center; gap: 12px; }
  .status { font-size: 12px; color: var(--ink-soft); display: flex; align-items: center; gap: 6px; white-space: nowrap; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #aab2bf; }
  .dot.ok { background: var(--ok); }
  .dot.err { background: var(--err); }
  .btn-ghost {
    border: 1px solid var(--line); background: var(--panel); color: var(--ink-soft);
    border-radius: 8px; padding: 6px 10px; font-size: 12.5px; cursor: pointer; font-family: inherit;
  }
  .btn-ghost:hover { border-color: var(--brand); color: var(--brand); }

  .notice {
    background: var(--warn-bg); color: var(--warn-ink);
    font-size: 12.5px; padding: 8px 20px; border-bottom: 1px solid #f0e2b4;
  }

  main { flex: 1; overflow-y: auto; }
  .chat { max-width: 860px; margin: 0 auto; padding: 24px 16px 8px; }

  .empty { text-align: center; padding: 32px 0 8px; }
  .empty h2 { font-size: 20px; margin: 0 0 6px; }
  .empty p { color: var(--ink-soft); margin: 0 0 20px; font-size: 14px; }
  .examples { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 10px; text-align: left; }
  .example {
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
    padding: 12px 14px; cursor: pointer; font-size: 14px; color: var(--ink); font-family: inherit; text-align: left;
  }
  .example:hover { border-color: var(--brand); background: var(--brand-soft); }
  .example small { display: block; color: var(--brand); font-size: 11.5px; font-weight: 600; margin-bottom: 2px; }

  .msg { display: flex; margin: 14px 0; }
  .msg.user { justify-content: flex-end; }
  .bubble { max-width: 85%; padding: 12px 16px; border-radius: var(--radius); word-break: keep-all; overflow-wrap: anywhere; }
  .user .bubble { background: var(--user); color: #fff; border-bottom-right-radius: 4px; white-space: pre-wrap; }
  .bot .bubble { background: var(--panel); border: 1px solid var(--line); border-bottom-left-radius: 4px; width: 85%; }
  .bot .answer p { margin: 0 0 8px; }
  .bot .answer p:last-child { margin-bottom: 0; }
  .bot .answer ul, .bot .answer ol { margin: 4px 0 8px; padding-left: 20px; }
  .bot .error { color: var(--err); }

  .typing span {
    display: inline-block; width: 6px; height: 6px; margin-right: 3px; border-radius: 50%;
    background: #9aa4b2; animation: blink 1.2s infinite both;
  }
  .typing span:nth-child(2) { animation-delay: .2s; }
  .typing span:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }

  .sources { margin-top: 12px; border-top: 1px dashed var(--line); padding-top: 10px; }
  .sources-title { font-size: 12px; font-weight: 600; color: var(--ink-soft); margin-bottom: 6px; }
  details.src { border: 1px solid var(--line); border-radius: 10px; margin-bottom: 6px; background: #fafbfd; }
  details.src summary {
    cursor: pointer; padding: 8px 12px; font-size: 13px; list-style: none;
    display: flex; justify-content: space-between; gap: 10px; align-items: center;
  }
  details.src summary::-webkit-details-marker { display: none; }
  details.src summary::before { content: "▸"; color: var(--ink-soft); margin-right: 4px; }
  details.src[open] summary::before { content: "▾"; }
  .src-name { flex: 1; font-weight: 600; }
  .score { font-size: 11.5px; color: var(--brand); background: var(--brand-soft); border-radius: 999px; padding: 1px 8px; white-space: nowrap; }
  .src-body { padding: 0 12px 10px; font-size: 13px; color: #333c48; white-space: pre-wrap; }
  .src-meta { font-size: 12px; color: var(--ink-soft); margin-top: 6px; white-space: normal; }

  footer { background: var(--panel); border-top: 1px solid var(--line); padding: 12px 16px 16px; }
  form { max-width: 860px; margin: 0 auto; display: flex; gap: 8px; align-items: flex-end; }
  textarea {
    flex: 1; resize: none; border: 1px solid var(--line); border-radius: 12px;
    padding: 11px 14px; font: inherit; max-height: 160px; outline: none; background: #fff; color: var(--ink);
  }
  textarea:focus { border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-soft); }
  .send {
    background: var(--brand); color: #fff; border: 0; border-radius: 12px;
    padding: 0 18px; height: 46px; font: inherit; font-weight: 600; cursor: pointer;
  }
  .send:disabled { background: #9db3d6; cursor: not-allowed; }
  .hint { max-width: 860px; margin: 6px auto 0; font-size: 11.5px; color: var(--ink-soft); }

  @media (max-width: 600px) {
    header { padding: 12px 16px; }
    header p, .status-text { display: none; }
    .bubble, .bot .bubble { max-width: 100%; width: 100%; }
    .notice { padding: 8px 16px; }
  }
</style>
</head>
<body>
<header>
  <div class="logo">QnA</div>
  <div>
    <h1>개인정보·신용정보 법령 QnA</h1>
    <p>개인정보 보호법 · 신용정보법 (법률 및 시행령) 기반 답변</p>
  </div>
  <div class="head-right">
    <div class="status"><span class="dot" id="dot"></span><span class="status-text" id="status">연결 확인 중</span></div>
    <button class="btn-ghost" id="reset" type="button">새 대화</button>
  </div>
</header>
<div class="notice">⚠ 본 답변은 업무 참고용이며 법률 자문이 아닙니다. 최신 법령과 준법감시부서 확인이 필요합니다. 실제 고객 개인정보는 입력하지 마세요.</div>

<main id="scroller">
  <div class="chat" id="chat">
    <div class="empty" id="empty">
      <h2>무엇이 궁금하신가요?</h2>
      <p>업무 중 개인정보·신용정보 처리 기준이 헷갈릴 때 질문해 보세요. 근거 조문과 함께 답변합니다.</p>
      <div class="examples" id="examples"></div>
    </div>
  </div>
</main>

<footer>
  <form id="form">
    <textarea id="input" rows="1" placeholder="예) 대출 상담 시 신용정보 조회 동의를 꼭 받아야 하나요?" maxlength="1000"></textarea>
    <button class="send" id="send" type="submit">보내기</button>
  </form>
  <div class="hint">Enter 보내기 · Shift+Enter 줄바꿈</div>
</footer>

<script>
const EXAMPLES = [
  ["수집·이용", "조합원 가입 시 주민등록번호를 수집해도 되나요?"],
  ["신용정보 조회", "대출 상담할 때 신용조회 동의를 꼭 받아야 하나요?"],
  ["마케팅", "예금 상품 홍보 문자를 보내려면 어떤 동의가 필요한가요?"],
  ["파기", "탈회한 조합원의 개인정보는 언제까지 보관할 수 있나요?"],
  ["유출 대응", "개인정보가 유출되면 언제까지 누구에게 알려야 하나요?"],
  ["위탁", "전산 업무를 외부 업체에 맡길 때 주의할 점은 무엇인가요?"],
];

const $ = (id) => document.getElementById(id);
const chat = $("chat"), input = $("input"), send = $("send"), scroller = $("scroller");
let history = [];
let busy = false;

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

// 아주 간단한 마크다운 변환: 굵게, 목록, 문단
function renderMarkdown(text) {
  const lines = escapeHtml(text).split("\n");
  let html = "", list = null;
  const closeList = () => { if (list) { html += `</${list}>`; list = null; } };
  for (const raw of lines) {
    const line = raw.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>").replace(/^#{1,6}\s*/, "");
    let m;
    if ((m = line.match(/^\s*[-*•]\s+(.*)/))) {
      if (list !== "ul") { closeList(); html += "<ul>"; list = "ul"; }
      html += `<li>${m[1]}</li>`;
    } else if ((m = line.match(/^\s*\d+[.)]\s+(.*)/))) {
      if (list !== "ol") { closeList(); html += "<ol>"; list = "ol"; }
      html += `<li>${m[1]}</li>`;
    } else if (line.trim() === "") {
      closeList();
    } else {
      closeList();
      html += `<p>${line}</p>`;
    }
  }
  closeList();
  return html;
}

function scrollDown() { scroller.scrollTop = scroller.scrollHeight; }

function addUser(text) {
  $("empty")?.remove();
  const el = document.createElement("div");
  el.className = "msg user";
  el.innerHTML = `<div class="bubble"></div>`;
  el.firstChild.textContent = text;
  chat.appendChild(el);
  scrollDown();
}

function addBot() {
  const el = document.createElement("div");
  el.className = "msg bot";
  el.innerHTML = `<div class="bubble"><div class="answer"><span class="typing"><span></span><span></span><span></span></span></div><div class="sources-slot"></div></div>`;
  chat.appendChild(el);
  scrollDown();
  return { answer: el.querySelector(".answer"), sources: el.querySelector(".sources-slot") };
}

function renderSources(slot, sources) {
  if (!sources.length) return;
  const items = sources.map((s) => {
    const qs = s.matched_questions?.length
      ? `<div class="src-meta">관련 질문: ${s.matched_questions.map(escapeHtml).join(" / ")}</div>` : "";
    const date = s.effective_date ? `<div class="src-meta">시행일: ${escapeHtml(s.effective_date)}</div>` : "";
    return `<details class="src">
      <summary><span class="src-name">「${escapeHtml(s.law)}」 ${escapeHtml(s.article)}(${escapeHtml(s.title)})</span>
      <span class="score">유사도 ${(s.score * 100).toFixed(0)}%</span></summary>
      <div class="src-body">${escapeHtml(s.text)}${date}${qs}</div>
    </details>`;
  }).join("");
  slot.innerHTML = `<div class="sources"><div class="sources-title">근거 조문 ${sources.length}건</div>${items}</div>`;
}

async function ask(question) {
  if (busy || !question.trim() || location.protocol === "file:") return;
  busy = true; send.disabled = true;
  addUser(question);
  const view = addBot();
  let answer = "";
  let failed = false;

  try {
    const res = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ question, history }),
    });
    if (!res.ok) {
      const body = await res.json().catch(() => ({}));
      throw new Error(body.detail || `서버 오류 (${res.status})`);
    }
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buf = "";
    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      let nl;
      while ((nl = buf.indexOf("\n")) >= 0) {
        const line = buf.slice(0, nl).trim();
        buf = buf.slice(nl + 1);
        if (!line) continue;
        const ev = JSON.parse(line);
        if (ev.type === "sources") renderSources(view.sources, ev.sources);
        else if (ev.type === "delta") { answer += ev.text; view.answer.innerHTML = renderMarkdown(answer); }
        else if (ev.type === "error") throw new Error(ev.message);
        scrollDown();
      }
    }
  } catch (e) {
    failed = true;
    view.answer.innerHTML = (answer ? renderMarkdown(answer) : "") +
      `<p class="error">⚠ ${escapeHtml(e.message || "알 수 없는 오류")}</p>`;
  } finally {
    if (!failed && answer) {
      history.push({ role: "user", content: question }, { role: "assistant", content: answer });
      history = history.slice(-6);
    }
    busy = false; send.disabled = false; input.focus(); scrollDown();
  }
}

// 예시 질문
const ex = $("examples");
for (const [tag, q] of EXAMPLES) {
  const b = document.createElement("button");
  b.className = "example"; b.type = "button";
  b.innerHTML = `<small>${tag}</small>${escapeHtml(q)}`;
  b.onclick = () => ask(q);
  ex.appendChild(b);
}

// 입력창
$("form").addEventListener("submit", (e) => {
  e.preventDefault();
  const q = input.value; input.value = ""; autoSize(); ask(q);
});
input.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); $("form").requestSubmit(); }
});
function autoSize() { input.style.height = "auto"; input.style.height = Math.min(input.scrollHeight, 160) + "px"; }
input.addEventListener("input", autoSize);

$("reset").onclick = () => location.reload();

// 서버 없이 파일로 직접 열었을 때 안내
if (location.protocol === "file:") {
  $("dot").className = "dot err";
  $("status").textContent = "서버로 실행해 주세요";
  $("empty").insertAdjacentHTML("afterbegin",
    `<p class="error" style="color:var(--err);font-weight:600">이 파일을 직접 열면 동작하지 않습니다.
     터미널에서 <code>uvicorn app.main:app --reload</code> 실행 후 http://localhost:8000 으로 접속하세요.</p>`);
  send.disabled = true;
  throw new Error("file:// 로 열림 - 서버 필요");
}

// 서버 상태
fetch("/api/health").then((r) => r.json()).then((h) => {
  $("dot").className = "dot " + (h.ready ? "ok" : "err");
  $("status").textContent = h.ready ? `준비됨 · 데이터 ${h.documents}건` : "준비 안 됨";
  if (!h.ready && h.error) $("status").title = h.error;
}).catch(() => { $("dot").className = "dot err"; $("status").textContent = "서버 연결 실패"; });
</script>
</body>
</html>
